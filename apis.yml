aid: faro
name: Faro
description: Faro Health is an AI platform for clinical development that helps biopharma
  and clinical research teams design and execute better studies. Founded in 2019 and
  headquartered in San Diego, California, Faro provides study design optimization, automated
  protocol document authoring, and clinical workflow automation, digitizing and structuring
  trial protocols so teams can accelerate development without compromising scientific
  rigor, patient safety, or patient-centricity. Faro is backed by investors including
  General Catalyst.
